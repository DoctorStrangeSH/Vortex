<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vortex Messenger</title>
    <meta name="theme-color" content="#101329">
    <link rel="icon" type="image/svg+xml" href="./vortex-mark.svg">
    <script>
        (() => {
            const theme = localStorage.getItem('vortex-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
