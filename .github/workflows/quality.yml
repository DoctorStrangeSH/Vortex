name: Quality checks

on:
  push:
    branches: [main, 'refactor/**', 'feat/**']
  pull_request:

permissions:
  contents: read

# Keep only the newest quality run for a branch; rapid documentation commits
# must not leave a long queue of stale checks ahead of the current main SHA.
concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:rules
      - run: npm run test:auth
      - run: npm run test:e2e:chat
      - run: npm run build
